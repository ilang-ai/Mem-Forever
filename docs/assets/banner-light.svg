<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Mem-Forever: memory that outlives the session. A ruler of sessions with the current one marked in gold.">
  <rect width="1200" height="320" fill="#e9eaec"/>
  <g transform="translate(48 44)">
    <rect width="40" height="40" rx="8" fill="#0b0f1a"/>
