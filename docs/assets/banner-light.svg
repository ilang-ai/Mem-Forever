    <line x1="150" y1="260" x2="150" y2="281"/>
    <line x1="1050" y1="260" x2="1050" y2="281"/>
  </g>
  <line x1="600" y1="256" x2="600" y2="285" stroke="#9a6f22" stroke-width="2"/>
  <g font-family="Bahnschrift, 'Segoe UI', 'SF Pro Text', 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="14" fill="#5f6368">
