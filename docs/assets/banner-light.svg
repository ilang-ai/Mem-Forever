    <rect x="18.5" y="11.9" width="3" height="2.9" fill="#d4a858"/>
    <rect x="18.75" y="17.2" width="2.5" height="10" fill="#d4a858"/>
  </g>
  <text x="104" y="74" font-family="Bahnschrift, 'Segoe UI', 'SF Pro Text', 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="22" font-weight="600" fill="#121314">iLang</text>
  <text x="48" y="158" font-family="Bahnschrift, 'Segoe UI', 'SF Pro Text', 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="68" font-weight="600" letter-spacing="-1.2" fill="#121314">Mem-Forever</text>
  <text x="48" y="214" font-family="Bahnschrift, 'Segoe UI', 'SF Pro Text', 'Noto Sans', 'DejaVu Sans', sans-serif" font-size="42" font-weight="600" letter-spacing="-0.6" fill="#7a5a1c">memory that outlives the session.</text>
  <g stroke="rgba(18,19,20,0.26)" stroke-width="1">
